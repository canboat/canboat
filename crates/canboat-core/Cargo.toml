[package]
name        = "canboat-core"
version     = { workspace = true }
edition     = { workspace = true }
license     = { workspace = true }
authors     = { workspace = true }
repository  = { workspace = true }
rust-version = { workspace = true }
description = "Sans-I/O NMEA 2000 (canboat) PGN database, parsers, decoder, and formatters."

[dependencies]
canboat-schema = { workspace = true }
thiserror     = { workspace = true }
log           = { workspace = true }
smallvec      = { workspace = true }
indexmap      = { workspace = true }
# `itoa` for fast u64 → ASCII in the fixed-precision float formatter.
# core::fmt::Display::<u64>::fmt was a measurable share of
# output/json.rs's CPU on the merrimac-2022 workload; itoa is several
# x faster and writes into a stack buffer.
itoa = "1"

[build-dependencies]
# The schema is derived from database/*.yaml at build time by keel, the same
# tool that generates the analyzer's C tables — one source of truth, and a
# `cargo build` picks up a YAML edit with no `make` in between. keel is
# deliberately dep-thin (yaml-rust2 only), so this costs almost nothing;
# tools/check-keel-deps.sh keeps it that way.
keel = { path = "../../keel" }
