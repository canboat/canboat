[package]
# The database tool, not a library: it is built from this repository and
# has no meaning outside it. Keep it off crates.io.
publish = false
name = "keel"
version = "0.1.0"
edition = "2024"
description = "CANboat PGN database tool: validate, generate, edit"
license = "Apache-2.0"
authors = ["Kees Verruijt <canboat@verruijt.net>"]

[dependencies]
# Deliberately minimal (DESIGN.md): YAML parsing only. The canonical YAML
# *writer* is our own (the style is keel's spec), floats print via libc
# snprintf (declared extern, no crate), and the editor server will use a
# minimal HTTP dependency when it lands.
yaml-rust2 = "0.12"

# NOTE: no [profile.release] here. keel is a member of the workspace at the
# repo root, and cargo only honours profiles from the workspace root manifest
# (it warns and ignores them elsewhere). The root sets lto = "thin",
# codegen-units = 1 and strip, which is at least as aggressive as the lto =
# true this used to carry.
