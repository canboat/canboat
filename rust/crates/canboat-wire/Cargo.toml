[package]
name        = "canboat-wire"
version     = { workspace = true }
edition     = { workspace = true }
license     = { workspace = true }
authors     = { workspace = true }
repository  = { workspace = true }
rust-version = { workspace = true }
description = "Compact postcard wire form of a decoded canboat PGN. Carries schema indices (field order, pgn-id hash) instead of resolved strings; both peers must link a byte-identical schema, enforced by the SCHEMA_HASH handshake."

[dependencies]
canboat-core = { workspace = true }
serde        = { workspace = true }
postcard     = { version = "1", features = ["alloc"] }
