# CodeRabbit configuration. Schema:
#   https://coderabbit.ai/integrations/schema.v2.json
#
# The point of most of this file is the path_filters block. CANboat commits
# hand-written source alongside large machine-written artifacts regenerated by
# `make generated`, and a routine database change touches both: a two-line YAML
# edit in database/ can rewrite hundreds of lines of canboat.xml, canboat.json
# and the analyzer's C tables. Reviewing the generated side is pure noise - it
# is derived, it is verified byte-for-byte by CI's "generated files are up to
# date" gate, and nobody may hand-edit it. See AGENTS.md §2.

language: en-US

reviews:
  # Comment where it matters rather than on every diff hunk.
  profile: chill
  # Advisory only: a bot must not hold a maintainer's PR closed.
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  collapse_walkthrough: true

  auto_review:
    enabled: true
    drafts: false
    # release-please's PRs are machine-written and re-created from scratch on
    # every push to master; there is nothing to review in them.
    ignore_title_keywords:
      - "chore: release"

  path_filters:
    # --- generated by keel, byte-checked in CI (AGENTS.md §2) ---
    - "!analyzer/*-generated-data.h"
    - "!crates/canboat-core/src/schema_generated.rs"
    - "!crates/canboat-core/src/schema_generated_j1939.rs"
    - "!crates/canboat-io/src/fastpacket_generated.rs"
    # --- derived from database/ via keel + xsltproc + dbc-exporter ---
    - "!docs/canboat.xml"
    - "!docs/canboat.json"
    - "!docs/canboat.html"
    - "!docs/canboat.dbc"
    # --- machine-maintained release/dependency state ---
    - "!CHANGELOG.md"
    - "!Cargo.lock"
    - "!.release-please-manifest.json"
    # --- captured bus traffic, often multi-megabyte binaries or hex dumps ---
    - "!samples/**"
    # NOT excluded on purpose: analyzer/pgn.h and analyzer/fieldtype.h are
    # hand-written despite sitting next to the generated tables, docs/canboat.
    # {xsl,css,js,xsd} are source, and keel/src/emit_*.rs only *contain* the
    # "GENERATED FILE" banner they write into their output.

  path_instructions:
    - path: "database/**/*.yaml"
      instructions: |
        This YAML tree is the single source of truth for the NMEA 2000 PGN
        database; every artifact under docs/, analyzer/*-generated-data.h and
        crates/**/schema_generated*.rs is derived from it by `keel generate`.

        Check that the change is consistent with the rest of the tree rather
        than only self-consistent: field bit offsets and lengths, lookup
        references resolving to a lookup of the right kind, `match` values
        existing in the referenced lookup, and repeating-set bookkeeping.

        `samples:` blocks are regression tests - each `raw:` line is decoded
        and compared against its `expects:` by rule R40. A change to a field's
        width, resolution or lookup usually has to be reflected there too.

        This is a reverse-engineered database. Prefer evidence from observed
        bus traffic over plausible-sounding inference, and treat an
        unexplained field as unknown rather than guessing at its meaning.
    - path: "keel/src/**"
      instructions: |
        keel validates the database and generates every artifact from it. A
        change to an emitter is only safe if `make generated` reproduces the
        committed artifacts exactly; call out anything that would alter output
        for unrelated PGNs.

        Rules live in keel/src/rules.rs and are the documented contract for
        `keel check` - a new or changed invariant in check.rs should have a
        matching entry there.
    - path: "analyzer/**/*.c"
      instructions: |
        C99, and the analyzer parses untrusted CAN frames from the wire.
        Watch for reads past the declared payload length, off-by-one in bit
        extraction, and unchecked lengths on variable-length fields.

        analyzer/pgn.h and analyzer/fieldtype.h are hand-written even though
        they sit beside generated tables; do not suggest regenerating them.
    - path: ".github/workflows/**"
      instructions: |
        Note whether a change alters which events trigger a workflow or which
        commits get checked. A push made by a bot token, or a force-push,
        may not deliver the `pull_request` events these workflows rely on,
        which can silently drop CI coverage from a PR head.
    - path: "**/*.rs"
      instructions: |
        The Rust crates decode the same wire formats as the C analyzer and are
        expected to agree with it; crates/canboat/tests/golden.rs pins that
        against the fixtures in analyzer/tests/. Flag changes that would make
        the two implementations diverge.

chat:
  auto_reply: true
