# CI for the Cargo workspace at the repo root (crates/* and keel/).
#
# Ported from canboat-rs's own ci.yml when the crates moved in
# (MERGE-CANBOAT-RS.md step 1). One deliberate difference from that original:
# the jobs are path-filtered. A C-only PR should not pay for a three-OS Rust
# build, so these run only when the Rust tree or this workflow changes. That
# means they are NOT suitable as *required* status checks — on a PR that
# touches no Rust they will not run at all.
#
# database/** is in the filter on purpose: the crates' build scripts read the
# schema, so a database change can break the Rust build.
#
# canboat-rs's schema-pin job is gone: there is no vendored schema any more.
# The build scripts read docs/canboat.json directly, so the runtime and the
# analyzer are generated from one database and cannot drift. The golden
# fixtures come from this checkout for the same reason.
#
# Jobs:
#   - test:       build + full test suite on Linux / macOS / Windows, and on
#                 Windows on ARM. The Linux leg also brings up a vcan
#                 interface so the SocketCAN device tests exercise a real
#                 socket.
#   - armv6:      static musl cross-build for 32-bit ARMv6 (Raspberry Pi Zero
#                 and 1), with the golden tests run under qemu as an
#                 ARM1176.
#   - msrv:       cargo check at the workspace's declared rust-version.
#   - wasm:       the sans-I/O library features (decode, json-input, node)
#                 build for wasm32-unknown-unknown, which canboat-wasm needs.
#   - clippy:     -D warnings, all targets; then each library feature set
#                 on its own (no cli) so a bad feature gate cannot hide
#                 behind the default build.
#   - fmt:        rustfmt check.
#   - docs:       facade rustdoc per library feature set with -D warnings.
#   - public-api: the facade's public API per library feature set against
#                 crates/doc/public-api/ (scripts/check-public-api.sh).
#   - coverage:   llvm-source-based line coverage, with a regression floor.
name: Rust CI

on:
  push:
    branches: [master]
    paths: &rust_paths
      - "crates/**"
      - "keel/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "database/**"
      - "docs/canboat.json"
      - ".github/workflows/rust-ci.yml"
      - ".github/actions/setup-vcan/action.yml"
      - "scripts/check-public-api.sh"
  pull_request:
    paths: *rust_paths

# Cancel superseded runs when a newer commit arrives on the same PR / branch;
# master is excluded so its runs always complete.
concurrency:
  group: rust-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'master' }}

jobs:
  test:
    name: Rust Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Golden fixtures come from this very checkout: the schema the crates
      # build against IS docs/canboat.json, so schema and fixtures cannot
      # drift. .gitattributes checks them out with LF everywhere, so the
      # byte-exact diffs hold on Windows too.
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2

      # canboat-io's SocketCAN tests drive a real socket when one is
      # there, and no-op when it is not. Linux only: the module — and
      # the code under test — exist nowhere else.
      - name: Set up vcan
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-vcan

      - name: Build
        run: cargo build --workspace --locked

      - name: Test (golden fixtures required)
        run: cargo test --workspace --locked
        env:
          CANBOAT_DIR: ${{ github.workspace }}
          CANBOAT_GOLDEN: required

  msrv:
    name: Rust MSRV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read MSRV from the workspace
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2

      # `rustup default` (set by dtolnay/rust-toolchain) loses to the repo's
      # rust-toolchain.toml, which pins `stable` - so a plain `cargo check`
      # here silently re-tests stable instead of the MSRV. `rustup run` names
      # the toolchain explicitly and wins over the file.
      - name: Check
        run: rustup run ${{ steps.msrv.outputs.version }} cargo check --workspace --all-targets --locked

  # ARMv6 with VFPv2: the Raspberry Pi Zero and 1, which the armv7 build does
  # not run on. Static musl like the other linux builds, linked by rust-lld
  # against the musl Rust ships, so no cross toolchain is needed. The golden
  # tests run under qemu-user as an ARM1176 (the Pi Zero's core): QEMU_CPU
  # reaches the canboat binary they spawn through binfmt too. The unit tests
  # are left to the native legs.
  armv6:
    name: Rust armv6 (qemu)
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_ARM_UNKNOWN_LINUX_MUSLEABIHF_LINKER: rust-lld
      CARGO_TARGET_ARM_UNKNOWN_LINUX_MUSLEABIHF_RUNNER: qemu-arm-static
      QEMU_CPU: arm1176
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable with the armv6 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: arm-unknown-linux-musleabihf

      - name: Install qemu-user
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static

      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --locked --target arm-unknown-linux-musleabihf

      - name: The binaries are static ARMv6
        run: |
          for bin in canboat keel; do
            f="target/arm-unknown-linux-musleabihf/debug/$bin"
            file "$f"
            file "$f" | grep -q "statically linked" || { echo "::error::$bin is not static"; exit 1; }
            readelf -A "$f" | grep -Eq "Tag_CPU_arch: v6(KZ)?$" || { echo "::error::$bin is not ARMv6"; exit 1; }
          done

      - name: Golden tests (fixtures required)
        run: cargo test -p canboat --test golden --locked --target arm-unknown-linux-musleabihf
        env:
          CANBOAT_DIR: ${{ github.workspace }}
          CANBOAT_GOLDEN: required

  # canboat-wasm builds the `decode` (engine + `codec`) and `json-input`
  # features for the browser. Checked here rather than by building that repo,
  # so a regression shows on the PR that causes it (#921). `node` is checked
  # too: it is transport-free by design, so a browser can be a node. Clippy
  # rather than `cargo check` because a wasm-only cfg can leave dead code
  # behind.
  wasm:
    name: Rust wasm32
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable with the wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2

      - name: Clippy for wasm32-unknown-unknown
        run: |
          for set in decode json-input node; do
            echo "::group::--features $set"
            cargo clippy -p canboat --target wasm32-unknown-unknown \
              --no-default-features --features "$set" --locked -- -D warnings
            echo "::endgroup::"
          done

  clippy:
    name: Rust Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Each library feature set on its own, without the CLI: the default
      # build enables everything, so only this catches a feature gate that
      # leaves a smaller set with a dangling import or unreachable helper.
      # Same list as `make rust-features`.
      - name: Clippy per library feature set
        run: |
          for set in decode io node bridge json-input nmea0183,ais \
                     decode,io,node,bridge,nmea0183,ais,json-input; do
            echo "::group::--features $set"
            cargo clippy -p canboat --no-default-features --features "$set" --locked -- -D warnings
            echo "::endgroup::"
          done

  fmt:
    name: Rust Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  docs:
    name: Rust Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2

      # A broken intra-doc link or a missing doc (the crate denies
      # missing_docs under `decode`) fails the build. The feature sets match
      # scripts/check-public-api.sh so the documented surface tracks the
      # locked public surface.
      - name: Generate library rustdoc (-D warnings)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          for set in \
            "decode" \
            "decode,io,nmea0183,ais" \
            "decode,io,node,bridge,nmea0183,ais"; do
            echo "::group::cargo doc --features $set"
            cargo doc --no-deps -p canboat --no-default-features --features "$set" --locked
            echo "::endgroup::"
          done

  public-api:
    name: Rust Public API
    runs-on: ubuntu-latest
    env:
      # cargo-public-api reads rustdoc JSON, which only nightly emits and
      # whose format each cargo-public-api release supports a range of.
      # Bump the two together, and re-run the script locally when you do.
      PUBLIC_API_TOOLCHAIN: nightly-2026-09-23
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust ${{ env.PUBLIC_API_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PUBLIC_API_TOOLCHAIN }}

      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-public-api
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-public-api@0.52.0

      # A diff means the public API changed: bless the snapshots with
      # `scripts/check-public-api.sh --bless` if that was the intent.
      - name: Check public API against the snapshots
        run: scripts/check-public-api.sh

  coverage:
    name: Rust Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable with llvm-tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # Without this the SocketCAN worker thread, its poll loop and the
      # TX ring are never entered, and the measured figure drops by about
      # a point. The action warns rather than fails when the runner kernel
      # has no vcan module, so the floor below is set to survive that.
      - name: Set up vcan
        uses: ./.github/actions/setup-vcan

      # Linux on purpose, and not only because it is the cheap runner:
      # canboat-io's SocketCAN device lives behind
      # `#[cfg(target_os = "linux")]`, so its module — and the tests inside
      # it — do not exist on a macOS or Windows run. Measuring anywhere else
      # would silently report that file as a 23-line unsupported stub.
      #
      # --fail-under-lines is a regression floor, not a target. It sits below
      # the current figure so ordinary work has headroom; raise it when the
      # number moves up for real. The uncovered remainder is concentrated in
      # code that needs a live socket or a terminal (the SocketCAN worker
      # thread, the bridge's TCP servers, the TUI's rendering), so do not
      # expect this to approach 100.
      - name: Coverage
        run: >
          cargo llvm-cov --workspace --all-features --locked
          --summary-only --fail-under-lines 65
        env:
          CANBOAT_DIR: ${{ github.workspace }}
          CANBOAT_GOLDEN: required

      # Same run, rendered into the job summary so a reviewer can see which
      # files moved without opening the log.
      - name: Publish the per-file table
        if: always()
        run: |
          {
            echo '## Rust coverage'
            echo
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
