name: Validate CZone provisional PGN improvements
on:
  push:
    branches: [feat/czone-pgn-decoding]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XML validation utility
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils xsltproc
      - name: Validate PGN definitions and captured samples
        run: keel/keel check
      - name: Generate database
        run: make generated
      - name: Run PR checks
        run: make pr
