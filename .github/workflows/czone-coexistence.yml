name: CZone BEP coexistence experiment
on:
  push:
    branches: [feat/czone-pgn-decoding]
  workflow_dispatch:
jobs:
  keel-coexistence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Stage candidate variants alongside unchanged upstream BEP definitions
        run: python3 research/czone/stage-coexistence.py .
      - name: Validate variant coexistence and sample decoding
        run: keel/keel check
