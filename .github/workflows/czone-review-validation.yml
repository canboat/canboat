name: CZone PR head validation
on:
  push:
    branches:
      - feat/czone-pgn-upstream
    paths:
      - 'database/**'
      - 'keel/**'
      - 'research/czone/**'
      - '.github/workflows/czone-review-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install generation dependencies
        run: sudo apt-get update && sudo apt-get install -y xsltproc libxml2-utils python3-setuptools
      - name: Validate database samples
        run: keel/keel check
      - name: Test keel decoder
        run: cargo test -p keel
      - name: Run C regression tests
        run: make tests
      - name: Regenerate and test artifacts
        run: make generated
      - name: Check PR contract
        run: |
          git fetch --no-tags origin master:refs/remotes/origin/master
          make pr
      - name: Verify generated artifacts match committed source
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard docs)"
