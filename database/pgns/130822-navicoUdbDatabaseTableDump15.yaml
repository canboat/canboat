pgn: 130822
id: navicoUdbDatabaseTableDump15
description: 'Navico: UDB Database, Table Dump'
type: Fast
variantOrder: 14
priority: 3
missing:
- Fields
- FieldLengths
- Resolution
explanation: 'Object Dump (Command 6) of Section 15, which holds tables of 32-bit floats; a B&G H5000 CPU broadcasts Sections
  11 to 15 and 18 about once a minute. After the Token come one or more tables until the data runs out, each a 16-bit count
  followed by that many records of a length byte (4) and a 32-bit float. Sections 11 to 14 and 18 hold tables of 7 values, which look like wind
  and boat speed correction tables; Section 15 holds tables of 22 values, and the H5000 cuts its dump off at the 223-byte
  Fast Packet maximum.'
researchDoc: navico_udb
