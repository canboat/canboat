pgn: 130820
id: fusionLowPassFilter
description: 'Fusion: Low Pass Filter'
type: Fast
variantOrder: 33
priority: 7
fields:
- id: manufacturerCode
  name: Manufacturer Code
  type: LOOKUP
  bits: 11
  description: Fusion Electronics
  match: 419
  lookup: MANUFACTURER_CODE
- id: reserved
  name: Reserved
  type: RESERVED
  bits: 2
- id: industryCode
  name: Industry Code
  type: LOOKUP
  bits: 3
  description: Marine Industry
  match: 4
  lookup: INDUSTRY_CODE
- id: messageId
  name: Message ID
  type: LOOKUP
  bits: 16
  description: Low Pass Filter
  match: 32793
  lookup: FUSION_STATUS_MESSAGE_ID
  primaryKey: true
- id: zone
  name: Zone
  type: UINT8
  primaryKey: true
- id: filter
  name: Filter
  type: LOOKUP
  bits: 8
  lookup: FUSION_LOW_PASS_FILTER
notes: |-
  The cutoff frequencies are Garmin's own: the Fusion Audio app's filter
  enumeration is LowPass50Hz(1), LowPass80Hz(2), LowPass120Hz(3),
  LowPass160Hz(4).

  Values 1 and 2 were originally documented as 55 Hz and 85 Hz, read off an
  MS-RA70N's user interface. An MS-WB670 displays 50 Hz and 80 Hz for the same
  wire values, and the app agrees with the latter. The frequencies are NOT
  model-dependent; the original labels were simply misread.

  Observed on a Fusion MS-RA70N controlled from an MS-NRX300 remote.
  The MS-RA70N has two zones and exposes subwoofer low-pass filter control
  only for Zone 1. The protocol message contains an explicit zone number, so
  this device limitation should not be interpreted as a protocol-wide
  restriction. Other Fusion models may expose this control on additional
  zones. Evidence: samples/fusion-ms-ra70n-zone-controls.raw.
