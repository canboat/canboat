notes: |-
  Per-zone gain for an internally amplified zone. Zone is zero-based and the
  gain is signed.

  Message id 32861 was absent from FUSION_STATUS_MESSAGE_ID.

  This message is reported only for zones that HAVE an internal amplifier. On
  an MS-WB670 whose third zone is a line-level pre-out, 32860 (external) was
  broadcast for all three zone slots while 32861 was broadcast only for the
  first two. That asymmetry is what identifies the pair.

  Field layout is from the Fusion Audio Android app, whose decoder reads zone
  as UInt8 and gain as Int8. Observed gain was always 0, so the signedness
  rests on the app rather than on a captured non-zero value.

  Evidence: samples/fusion-amp-gain.raw.
