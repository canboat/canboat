pgn: 130820
id: fusionMenuActionStatus
description: 'Fusion: Menu Action Status'
type: Fast
variantOrder: 50
priority: 7
fields:
- id: manufacturerCode
  name: Manufacturer Code
  type: LOOKUP
  bits: 11
  description: Fusion Electronics
  match: 419
  lookup: MANUFACTURER_CODE
- id: reserved
  name: Reserved
  type: RESERVED
  bits: 2
- id: industryCode
  name: Industry Code
  type: LOOKUP
  bits: 3
  description: Marine Industry
  match: 4
  lookup: INDUSTRY_CODE
- id: messageId
  name: Message ID
  type: LOOKUP
  bits: 16
  description: Menu Action
  match: 32783
  lookup: FUSION_STATUS_MESSAGE_ID
  primaryKey: true
- id: sourceId
  name: Source ID
  type: UINT8
  description: Runtime source identifier announced by Fusion Source status messages; not a stable source-type enumeration.
  primaryKey: true
- id: itemIndex
  name: Item Index
  type: UINT32
- id: action
  name: Action
  type: LOOKUP
  bits: 8
  lookup: FUSION_MENU_STATUS
- id: lockId
  name: Lock ID
  type: UINT8
notes: |-
  The status uses its own enumeration (FUSION_MENU_STATUS), not the command's
  FUSION_MENU_ACTION: value 3 is Item Updated here but Step Back in the
  command, and 5 is Locked here but Exit there. Both enumerations are from
  Garmin's Fusion Audio app; Item Updated is also seen on the wire.

  lockId is the menu lock ID allocated by PGN 130820 message id 32786 "Menu
  Lock ID" in reply to PGN 126720 proprietary id 12 "Request Menu Lock ID"; see
  those for how it is obtained and used.

  Evidence: samples/fusion-ra70n-menu-operations.raw and the existing
  samples/boatkit-fusion-menu.raw.
samples:
- raw: "2026-08-09T13:43:00.416360755-07:00,7,130820,10,255,11,a3,99,0f,80,02,04,00,00,00,04,00"  # from boatkit-fusion-menu.raw
  expects:
    manufacturerCode: "Fusion Electronics"
    industryCode: "Marine Industry"
    messageId: "Menu Action"
    sourceId: 2
    itemIndex: 4
    action: "Closed"
    lockId: 0
- raw: "2026-09-19T06:43:06.945504Z,7,130820,12,255,11,a3,99,0f,80,06,00,00,00,00,03,01"
  expects:
    manufacturerCode: "Fusion Electronics"
    industryCode: "Marine Industry"
    messageId: "Menu Action"
    sourceId: 6
    itemIndex: 0
    action: "Item Updated"
    lockId: 1
