notes: |-
  An RDS character-encoding bug has been observed on at least the MS-RA70N:
  the station name in Track retains RDS G0 (EBU Latin) bytes instead of being
  converted to UTF-8. The same incorrect character is reported on the radio's
  own display and in text decoded from its CAN output.

  For Radio Bohuslan (with U+00E4, LATIN SMALL LETTER A WITH DIAERESIS), the
  eight-character RDS station name alternates between " Radio  " and
  "Bohusl<U+00E4>n". The latter is transmitted as
  42 6f 68 75 73 6c 91 6e: 0x91 is U+00E4 in RDS G0; UTF-8 would use c3 a4.
  This observation does not establish the encoding used by other Fusion
  models or by other text fields.
  Character set reference: https://en.wikipedia.org/wiki/EBU_Latin
  Evidence: samples/fusion-ms-ra70n-rds-encoding.log (original candump frames).
