  bits: 6
  description: Object Dump
  match: 6
  primaryKey: true
- id: reserved6
  name: Reserved
  type: RESERVED
  bits: 2
- id: address
  name: Address
  type: UINT8
  description: Part of the object address
- id: section
  name: Section
  type: UINT8
  match: 11
  primaryKey: true
- id: item
  name: Item
  type: UINT8
- id: objectValue
  name: Object Value
  type: UINT16
  description: Current value (A); 0xFC00 means no value
- id: sub
  name: Sub
  type: BINARY
  bits: 24
  description: Sub-index and auxiliary bytes
- id: token
  name: Token
  type: UINT16
  description: Per-object identity/CRC-like token (B), constant per object
- repeat:
    fields:
    - id: count
      name: Count
      type: UINT16
      description: Number of values in this table
    - repeat:
        countField: count
        fields:
        - id: length
          name: Length
          type: UINT8
          description: Always 4
        - id: value
          name: Value
          type: FLOAT
