pgn: 130828
id: sleipnerDeviceStatusFast
description: 'Sleipner: Device Status (Fast)'
type: Fast
variantOrder: 3
missing:
- Fields
- FieldLengths
- SampleData
explanation: >-
  Sent at ~2 Hz by Sleipner S-Link devices, including while the system is in standby.
  The unique number matches the ISO identity number the same device claims in PGN 60928,
  which is how the field was identified. The device index and state occupy the same byte
  and take the same values as in PGN 130827.
fields:
- id: manufacturerCode
  name: Manufacturer Code
  type: LOOKUP
  bits: 11
  description: Sleipner Motor
  match: 306
  lookup: MANUFACTURER_CODE
- id: reserved
  name: Reserved
  type: RESERVED
  bits: 2
- id: industryCode
  name: Industry Code
  type: LOOKUP
  bits: 3
  description: Marine Industry
  match: 4
  lookup: INDUSTRY_CODE
- id: deviceType
  name: Device Type
  type: UINT8
  description: Constant per device
- id: deviceIndex
  name: Device Index
  type: UNSIGNED_INTEGER
  bits: 4
  description: Stable per-device index
- id: state
  name: State
  type: LOOKUP
  bits: 4
  lookup: SLEIPNER_THRUSTER_STATE
- id: uniqueNumber
  name: Unique Number
  type: UNSIGNED_INTEGER
  bits: 24
  description: ISO Identity Number, as claimed by this device in PGN 60928
- id: a
  name: A
  type: UINT8
