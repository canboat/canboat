notes: |-
  A 64-bit word advertising the head unit's hardware and features: connectors,
  radios, controls and amplifier ratings. It describes what the unit has, not
  what is currently connected or enabled.

  The bit names come from Garmin's own decoder in the Fusion Audio Android app,
  which reads this message as one little-endian 64-bit word and tests each
  feature with a single-bit mask. Bits 27-32, 40, 49 and 51-63 have no name in
  the app; bits 27-31, 51 and 52 are nevertheless set on real units.

  Static: identical across power cycles, a firmware update and a factory reset
  on the MS-RA70N, and across six days and power cycles on the MS-WB670. Sent
  in the status dump together with 32798 "Capabilities" and 32865 "Zone
  Capabilities Extended", in that order.

  Older firmware appears not to set every bit that applies: the MS-RA70N has an
  LCD and an NMEA 2000 port but sets neither bit. Treat a set bit as reliable
  and a clear bit as "not advertised".

  Evidence: samples/fusion-system-capabilities.raw (MS-WB670 and MS-RA70N).
