notes: >-
  A Maretron ALM100 annunciator lists this PGN, and only this PGN of the annunciator
  group, on its receive list when asked for its PGN list (126464); 130817 and 130824 it
  reports only as transmit. See samples/maretron-alm100-pgnlist.raw.

  Replaying a captured 130819 frame at an ALM100 on an otherwise silent bus did NOT make
  it sound, and produced no response from the device at all, so a well-formed alert alone
  is not sufficient to drive the annunciator. The device most likely has to be configured
  to react to a particular alert first, via 126720 (Maretron proprietary configuration,
  opcodes 64 and 65, Write and Read Alert Config). See research/maretron_alm100.md.

  The trailing Maretron Extension is not yet carved. On a live bus its last bytes are
  consistently a canboat-style counted ASCII string: a length byte holding the text length
  plus two, then 01, then the text. Observed values include 09 01 "Tripped", 05 01 "Off"
  and 04 01 "On", each preceded by 32 00.
