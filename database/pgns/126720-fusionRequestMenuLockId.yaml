pgn: 126720
id: fusionRequestMenuLockId
description: 'Fusion: Request Menu Lock ID'
type: Fast
variantOrder: 57
fields:
- id: manufacturerCode
  name: Manufacturer Code
  type: LOOKUP
  bits: 11
  description: Fusion Electronics
  match: 419
  lookup: MANUFACTURER_CODE
- id: reserved
  name: Reserved
  type: RESERVED
  bits: 2
- id: industryCode
  name: Industry Code
  type: LOOKUP
  bits: 3
  description: Marine Industry
  match: 4
  lookup: INDUSTRY_CODE
- id: proprietaryId
  name: Proprietary ID
  type: LOOKUP
  bits: 16
  description: Request Menu Lock ID
  match: 12
  lookup: FUSION_MESSAGE_ID
  primaryKey: true
- id: requestToken
  name: Request Token
  type: UINT32
notes: |-
  Requests allocation of a one-byte menu lock ID. The four-byte requestToken is
  chosen by the controller and echoed unchanged by PGN 130820 message id 32786
  "Menu Lock ID", allowing the controller to correlate the asynchronous reply.

  Capture evidence shows that requestToken is echoed unchanged in the allocation
  response while the returned one-byte lockId is subsequently used by Menu
  Action, Menu Count and Menu Item operations.

  requestToken is represented as UINT32 because the existing wire encoding is
  little-endian and all four bytes belong to the echoed token; no arithmetic
  meaning is implied.


  Garmin's Fusion Audio app works the same way: it sends a random seed as the
  token, keeps the lockId only from the reply that echoes its own seed, and
  compares it against the lockId of every Menu Action, Menu Count and Menu Item
  reply. A reply carrying a different lockId means another controller holds
  the menu, which the app shows as locked.

  Evidence: samples/fusion-ra70n-menu-lock.raw.
