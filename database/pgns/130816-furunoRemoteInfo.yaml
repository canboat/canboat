pgn: 130816
id: furunoRemoteInfo
description: 'Furuno: Remote Info'
type: Fast
variantOrder: 25
priority: 7
explanation: Broadcast by a Furuno MCU-006 remote after its MFD sends it Remote Command 0. Known from the firmware only.
notes: |-
  The Furuno MCU-006 / MCU-006H RotoKey remote is a HID keyboard and pointer tunnelled over
  NMEA 2000 to one paired TimeZero MFD. Layout from the MCU-006 firmware 01.03.
