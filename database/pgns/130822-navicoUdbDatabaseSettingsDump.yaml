  bits: 2
- id: industryCode
  name: Industry Code
  type: LOOKUP
  bits: 3
  description: Marine Industry
  match: 4
  lookup: INDUSTRY_CODE
- id: marker
  name: Marker
  type: UINT8
  description: Always 0xFF
- id: command
  name: Command
  type: UNSIGNED_INTEGER
  bits: 6
  description: Object Dump
  match: 6
  primaryKey: true
- id: reserved6
  name: Reserved
  type: RESERVED
  bits: 2
- id: address
  name: Address
  type: UINT8
  description: Part of the object address
- id: section
  name: Section
  type: UINT8
  match: 10
  primaryKey: true
- id: item
  name: Item
  type: UINT8
- id: objectValue
  name: Object Value
  type: UINT16
  description: Current value (A); 0xFC00 means no value
- id: sub
  name: Sub
  type: BINARY
  bits: 24
  description: Sub-index and auxiliary bytes
- id: token
  name: Token
  type: UINT16
  description: Per-object identity/CRC-like token (B), constant per object
- repeat:
    fields:
    - id: flag
      name: Flag
      type: UINT8
      description: Always 1
    - id: reserved15
      name: Reserved
      type: RESERVED
      bits: 8
    - id: length
      name: Length
      type: DYNAMIC_FIELD_LENGTH
      bits: 8
      description: Byte length of the Value field that follows
      dynamicFieldLength: true
    - id: value
      name: Value
      type: DYNAMIC_FIELD_VALUE
      description: The value of the setting this record's position selects; a 32-bit float, a 1-byte count or flag, or a 64-bit NMEA 2000 NAME.
