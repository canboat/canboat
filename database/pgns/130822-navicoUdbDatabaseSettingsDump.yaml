pgn: 130822
id: navicoUdbDatabaseSettingsDump
description: 'Navico: UDB Database, Settings Dump'
type: Fast
variantOrder: 7
priority: 3
missing:
- Fields
- FieldLengths
- Resolution
explanation: 'Object Dump (Command 6) of Section 10, Item 1: the settings object that the Command 3 Configuration Set updates
  one record at a time. A B&G H5000 CPU broadcasts it about once a minute. The records carry no id: record n holds Source
  Setting Id n (NAVICO_SOURCE_SETTING_ID), so records 17 to 22 are the wind and boat speed sources (a count, or a source''s
  64-bit NMEA 2000 NAME) and record 24 is the true wind direction damping. On an H5000 the other records hold boat settings,
  mostly as 32-bit floats; by value, record 0 matches the GPS offset from the center line, 1 the GPS to bow distance,
  3 the leeway coefficient, 7 the mast height, 13 the boat length and 14 the boat speed calibration distance.'
researchDoc: navico_udb
