notes: |-
  Per-zone gain for an externally amplified zone. Zone is zero-based and the
  gain is signed.

  Message id 32860 was absent from FUSION_STATUS_MESSAGE_ID, which jumped from
  32859 to 32862.

  Field layout is from the Fusion Audio Android app (fusion.link.remote
  13.0.0), whose decoder reads zone as UInt8 and gain as Int8 -- the same
  signed-gain shape as PGN 130820 Aux Gain:

      zone = getUInt8(buffer, 2)
      gain = getInt8 (buffer, 3)

  Observed on a Fusion MS-WB670 for all three of its zone slots, always with
  gain 0, so the signedness rests on the app rather than on a captured
  non-zero value.

  Evidence: samples/fusion-amp-gain.raw.
