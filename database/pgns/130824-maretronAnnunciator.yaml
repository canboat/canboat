- id: annunciatorInstance
  name: Annunciator Instance
  type: UINT8
  primaryKey: true
- id: annunciatorState
  name: Annunciator State
  type: UINT8
  description: 100 while the annunciator is sounding, 0 while it is idle.
- id: pattern
  name: Pattern
  type: UINT16
  description: >-
    Selects the pulse pattern; observed values 0 to 4 give audibly different beep
    cadences, not different pitches. Unavailable while idle.
- id: field7
  name: Field 7
  type: UINT8
- id: alertId
  name: Alert ID
  type: UINT16
  description: Identifies the alert the annunciator is currently sounding for.
notes: >-
  Status report from a Maretron annunciator. It is not written directly: an ALM100 asked
  for its PGN list (126464) reports 130824 only on its transmit list, and writing 130824
  at the device has no effect. The annunciator is driven instead by a 126208 NMEA
  Command group function addressed to the device, targeting this PGN and writing these
  fields. See samples/maretron-alm100-command.raw and research/maretron_alm100.md.

  Idle, an ALM100 emits 00 00 ff ff ff ff ff every ten seconds; M/V Dirona's annunciator
  emitted the identical payload. While sounding, Annunciator State is 100, Pattern is set,
  Alert ID names the alert being annunciated, and the rate rises to 1 Hz. Both the sounding
  and the silent state were reproduced from canboat by sending the 126208 command, and the
  device's own 130824 echoes back the values commanded.

  Field 7 is still unidentified; it was 23 in every frame observed, both from the vessel's
  own configuration software and in the commands replayed here. The field count is not
  guesswork: the device answers a request on this PGN with a 126208 Acknowledge group
  function reporting exactly five parameters.
