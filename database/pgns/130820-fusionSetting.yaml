pgn: 130820
id: fusionSetting
description: 'Fusion: Setting'
type: Fast
variantOrder: 29
priority: 7
fields:
- id: manufacturerCode
  name: Manufacturer Code
  type: LOOKUP
  bits: 11
  description: Fusion Electronics
  match: 419
  lookup: MANUFACTURER_CODE
- id: reserved
  name: Reserved
  type: RESERVED
  bits: 2
- id: industryCode
  name: Industry Code
  type: LOOKUP
  bits: 3
  description: Marine Industry
  match: 4
  lookup: INDUSTRY_CODE
- id: messageId
  name: Message ID
  type: LOOKUP
  bits: 16
  description: Setting
  match: 32788
  lookup: FUSION_STATUS_MESSAGE_ID
  primaryKey: true
- id: id
  name: ID
  type: LOOKUP
  bits: 32
  lookup: FUSION_SETTING
- id: value
  name: Value
  type: INDIRECT_LOOKUP
  bits: 32
  lookupIndirect:
    name: FUSION_SETTING_VALUE
    order: 5
notes: |-
  `value` is an INDIRECT_LOOKUP keyed on the `id` field, so a setting whose
  values form a closed set decodes to a name. Only FUSION_SETTING 7 "Tuner
  Region" is enumerated so far; every other setting's value decodes as the
  plain number it always did, which is what the preset frequencies and the
  volume levels need.

  Not every setting belongs in the enumeration. Id 74 "Volume Zone Sync" is
  deliberately left out: its value is a zero-based ZONE INDEX with a sentinel
  (observed 0 and 1 selecting a zone, 4 meaning All), so the meaningful values
  depend on how many zones the unit has rather than forming a fixed list.

  AM preset IDs 14 through 28 and FM preset IDs 29 through 43 use value as
  the stored preset frequency in Hz. A value of zero indicates an empty
  preset.

  This message is observed as the immediate status update after changing
  or clearing a tuner preset with Fusion: Set Setting on PGN 126720.

  Evidence: samples/fusion-tuner-presets.raw.

