pgn: 130820
id: fusionSetting
description: 'Fusion: Setting'
type: Fast
variantOrder: 29
priority: 7
fields:
- id: manufacturerCode
  name: Manufacturer Code
  type: LOOKUP
  bits: 11
  description: Fusion Electronics
  match: 419
  lookup: MANUFACTURER_CODE
- id: reserved
  name: Reserved
  type: RESERVED
  bits: 2
- id: industryCode
  name: Industry Code
  type: LOOKUP
  bits: 3
  description: Marine Industry
  match: 4
  lookup: INDUSTRY_CODE
- id: messageId
  name: Message ID
  type: LOOKUP
  bits: 16
  description: Setting
  match: 32788
  lookup: FUSION_STATUS_MESSAGE_ID
  primaryKey: true
- id: id
  name: ID
  type: LOOKUP
  bits: 32
  lookup: FUSION_SETTING
- id: value
  name: Value
  type: UINT32
notes: |-
  AM preset IDs 14 through 28 and FM preset IDs 29 through 43 use value as
  the stored preset frequency in Hz. A value of zero indicates an empty
  preset.

  This message is observed as the immediate status update after changing
  or clearing a tuner preset with Fusion: Set Setting on PGN 126720.

  Evidence: samples/fusion-tuner-presets.raw.

