pgn: 262388
id: actisenseNegativeAck
description: 'Actisense: Negative Ack'
explanation: >-
  BEM F4H, sent by an Actisense gateway when it cannot carry out a command;
  the Error ID says why. See the Actisense SDK,
  https://github.com/Actisense/SDK/blob/main/docs/DataFormats/Binary/bem-detail/negative-ack.md.
type: Fast
fields:
- id: sid
  name: SID
  type: UINT8
- id: modelId
  name: Model ID
  type: UINT16
- id: serialId
  name: Serial ID
  type: UINT32
- id: errorId
  name: Error ID
  type: INT32
  description: Actisense error code; 0 is success
- id: uniqueCommandId
  name: Unique Command ID
  type: UINT32
samples:
- raw: "2023-01-01-00:00:00.000,0,262388,0,0,15,01,0e,00,ab,b0,01,00,47,fd,ff,ff,f2,00,04,00"  # from merrimac-actisense-serial-2011.raw
  expects:
    sid: 1
    modelId: 14
    serialId: 110763
    errorId: -697
    uniqueCommandId: 262386
- raw: "2023-01-01-00:00:00.000,0,262388,0,0,15,01,0e,00,ab,b0,01,00,47,fd,ff,ff,81,ff,01,ff"  # from merrimac-actisense-serial-2011.raw
  expects:
    sid: 1
    modelId: 14
    serialId: 110763
