pgn: 130820
id: fusionBalance
description: 'Fusion: Balance'
type: Fast
variantOrder: 32
priority: 7
fields:
- id: manufacturerCode
  name: Manufacturer Code
  type: LOOKUP
  bits: 11
  description: Fusion Electronics
  match: 419
  lookup: MANUFACTURER_CODE
- id: reserved
  name: Reserved
  type: RESERVED
  bits: 2
- id: industryCode
  name: Industry Code
  type: LOOKUP
  bits: 3
  description: Marine Industry
  match: 4
  lookup: INDUSTRY_CODE
- id: messageId
  name: Message ID
  type: LOOKUP
  bits: 16
  description: Balance
  match: 32792
  lookup: FUSION_STATUS_MESSAGE_ID
  primaryKey: true
- id: zone
  name: Zone
  type: UINT8
  primaryKey: true
- id: value
  name: VALUE
  type: INT8
notes: |-
  Observed on a Fusion MS-RA70N controlled from an MS-NRX300 remote.
  The balance value is signed and encoded as an 8-bit two's-complement value.
  Negative values shift balance to the left; positive values shift it to the
  right; zero is centered.
  Evidence: samples/fusion-ms-ra70n-zone-controls.raw.
