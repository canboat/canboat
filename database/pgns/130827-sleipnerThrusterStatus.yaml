pgn: 130827
id: sleipnerThrusterStatus
description: 'Sleipner: Thruster Status'
type: Fast
variantOrder: 3
missing:
- Fields
- FieldLengths
explanation: >-
  Sent by Sleipner S-Link thruster controllers (PPC-series) once the system is switched
  on. The unique number matches the ISO identity number the same device claims in PGN
  60928, which is how the field was identified. Thrust is signed, and its sign follows
  the direction commanded in PGN 65280: commands with state "Thrust direction 2" produce
  positive thrust, "Thrust direction 1" negative. On retractable units the state field
  also reports the deployment travel. Fields A, B, C, D and the trailing byte E are not yet
  understood.
fields:
- id: manufacturerCode
  name: Manufacturer Code
  type: LOOKUP
  bits: 11
  description: Sleipner Motor AS
  match: 306
  lookup: MANUFACTURER_CODE
- id: reserved
  name: Reserved
  type: RESERVED
  bits: 2
- id: industryCode
  name: Industry Code
  type: LOOKUP
  bits: 3
  description: Marine Industry
  match: 4
  lookup: INDUSTRY_CODE
- id: controllerType
  name: Controller Type
  type: UINT8
  description: Constant per device; distinguishes the fitted controller models
- id: thrusterId
  name: Thruster Id
  type: UNSIGNED_INTEGER
  bits: 4
  description: Stable per-unit index within the thruster group
- id: state
  name: State
  type: LOOKUP
  bits: 4
  lookup: SLEIPNER_THRUSTER_STATE
- id: uniqueNumber
  name: Unique Number
  type: UNSIGNED_INTEGER
  bits: 24
  description: ISO Identity Number, as claimed by this device in PGN 60928
- id: a
  name: A
  type: UINT8
- id: b
  name: B
  type: UINT8
- id: c
  name: C
  type: UINT8
- id: d
  name: D
  type: UINT8
- id: thrust
  name: Thrust
  type: PERCENTAGE_INT8
  description: Reported thrust, -100 to 100%; the sign is the direction
- id: e
  name: E
  type: UINT8
samples:
- raw: "2023-01-01-00:00:00.000,6,130827,8,255,13,32,99,19,a1,01,ae,04,00,55,ff,7f,00,64"  # from sleipner-slink-thruster.raw
  expects:
    manufacturerCode: "Sleipner Motor AS"
    industryCode: "Marine Industry"
    controllerType: 25
    thrusterId: 1
    state: "Ready"
    uniqueNumber: 306689
    a: 0
    b: 85
    c: ~
    d: 127
    thrust: 0
    e: 100
- raw: "2023-01-01-00:00:00.000,6,130827,8,255,13,32,99,19,b1,01,ae,04,00,54,ff,7f,64,64"  # from sleipner-slink-thruster.raw
  expects:
    manufacturerCode: "Sleipner Motor AS"
    industryCode: "Marine Industry"
    controllerType: 25
    thrusterId: 1
    state: "Thrusting"
    uniqueNumber: 306689
