    b: 84
    c: ~
    d: 127
    thrust: 100
    e: 100
- raw: "2023-01-01-00:00:00.000,6,130827,8,255,13,32,99,19,b1,01,ae,04,00,54,ff,7f,9c,64"  # from sleipner-slink-thruster.raw
  expects:
    manufacturerCode: "Sleipner Motor AS"
    industryCode: "Marine Industry"
    controllerType: 25
    thrusterId: 1
    state: "Thrusting"
    uniqueNumber: 306689
    a: 0
