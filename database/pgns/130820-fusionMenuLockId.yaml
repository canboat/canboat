pgn: 130820
id: fusionMenuLockId
description: 'Fusion: Menu Lock ID'
type: Fast
variantOrder: 15
priority: 7
fields:
- id: manufacturerCode
  name: Manufacturer Code
  type: LOOKUP
  bits: 11
  description: Fusion Electronics
  match: 419
  lookup: MANUFACTURER_CODE
- id: reserved
  name: Reserved
  type: RESERVED
  bits: 2
- id: industryCode
  name: Industry Code
  type: LOOKUP
  bits: 3
  description: Marine Industry
  match: 4
  lookup: INDUSTRY_CODE
- id: messageId
  name: Message ID
  type: LOOKUP
  bits: 16
  description: Menu Lock ID
  match: 32786
  lookup: FUSION_STATUS_MESSAGE_ID
  primaryKey: true
- id: requestToken
  name: Request Token
  type: UINT32
- id: lockId
  name: Lock ID
  type: UINT8
notes: |-
  Response to PGN 126720 proprietary id 12 "Request Menu Lock ID". requestToken
  echoes the controller-supplied four-byte token unchanged. lockId is the
  separately allocated one-byte menu lock ID used by subsequent Menu Action,
  Menu Count and Menu Item operations.

  Capture evidence shows requestToken round-tripping unchanged while different
  lockId values are returned across allocation exchanges and then carried by
  subsequent menu operations.

  Evidence: samples/fusion-ra70n-menu-lock.raw and samples/fusion-130820-status.raw.
samples:
- raw: "2023-01-01-00:00:00.000,7,130820,13,255,9,a3,99,12,80,f8,15,00,00,3c"  # from fusion-130820-status.raw
  expects:
    manufacturerCode: "Fusion Electronics"
    industryCode: "Marine Industry"
    messageId: "Menu Lock ID"
    requestToken: 5624
    lockId: 60
- raw: "2026-09-19T08:46:38.371Z,7,130820,12,255,9,a3,99,12,80,cd,81,00,00,01"
  expects:
    manufacturerCode: "Fusion Electronics"
    industryCode: "Marine Industry"
    messageId: "Menu Lock ID"
    requestToken: 33229
    lockId: 1
