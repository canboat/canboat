pgn: 130825
id: mercuryCruiseControlData
description: 'Mercury: Cruise Control Data'
type: Fast
variantOrder: 4
priority: 7
missing:
- Fields
explanation: 'Opcode 4 (Cruise Control) sub-message of Mercury PGN 130825: engine instance, a message type byte, the cruise
  RPM setpoint in 1 rpm steps and the cruise speed setpoint in 0.01 km/h steps (0xFFFF = not available). An RPM cruise command
  leaves the speed setpoint not available and a speed cruise command leaves the RPM setpoint not available. Some payload bytes
  are not yet identified.'
fields:
- id: manufacturerCode
  name: Manufacturer Code
  type: LOOKUP
  bits: 11
  description: Mercury Marine
  match: 144
  lookup: MANUFACTURER_CODE
- id: reserved
  name: Reserved
  type: RESERVED
  bits: 2
- id: industryCode
  name: Industry Code
  type: LOOKUP
  bits: 3
  description: Marine Industry
  match: 4
  lookup: INDUSTRY_CODE
- id: opcode
  name: Opcode
  type: LOOKUP
  bits: 8
  description: Cruise Control
  match: 4
  lookup: MERCURY_COMMAND_OPCODE
- id: engineInstance
  name: Engine Instance
  type: UINT8
- id: reserved6
  name: Reserved
  type: RESERVED
  bits: 8
- id: cruiseState
  name: Cruise State
  type: UINT8
  description: 0 = disengaged, 1 = RPM cruise, 2 = Smart Tow, 3 = speed cruise, 5 = status update
- id: cruiseRpmSetpoint
  name: Cruise RPM Setpoint
  type: UINT16
  unit: rpm
- id: cruiseSpeedSetpoint
  name: Cruise Speed Setpoint
  type: UFIX16
  resolution: 0.01
  unit: km/h
- id: reserved10
  name: Reserved
  type: RESERVED
  bits: 24
samples:
- raw: "2023-01-01-00:00:00.000,7,130825,2,255,13,90,98,04,ff,ff,00,ff,ff,ff,ff,ff,ff,ff"  # from mercury-proprietary.raw
  expects:
    manufacturerCode: "Mercury Marine"
    industryCode: "Marine Industry"
    opcode: "Cruise Control"
    engineInstance: ~
    cruiseState: 0
    cruiseRpmSetpoint: ~
    cruiseSpeedSetpoint: ~
