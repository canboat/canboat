pgn: 130820
id: fusionZoneName
description: 'Fusion: Zone Name'
type: Fast
variantOrder: 12
priority: 7
fields:
- id: manufacturerCode
  name: Manufacturer Code
  type: LOOKUP
  bits: 11
  description: Fusion Electronics
  match: 419
  lookup: MANUFACTURER_CODE
- id: reserved
  name: Reserved
  type: RESERVED
  bits: 2
- id: industryCode
  name: Industry Code
  type: LOOKUP
  bits: 3
  description: Marine Industry
  match: 4
  lookup: INDUSTRY_CODE
- id: messageId
  name: Message ID
  type: LOOKUP
  bits: 16
  description: Zone Name
  match: 32813
  lookup: FUSION_STATUS_MESSAGE_ID
  primaryKey: true
- id: zone
  name: Zone
  type: UINT8
  primaryKey: true
- id: name
  name: Name
  type: STRING_LZ
notes: |-
  Zone is zero-based: index 0 is the zone the user interface calls Zone 1. A
  unit with default names reports index 2 as "Zone 3", and an MS-WB670 whose
  first two zones had been renamed reported 0 = "Doghouse", 1 = "Saloon",
  2 = "Zone 3".

  The field was called `number` until it was renamed to `zone` for consistency
  with every other zone-selecting field in the Fusion PGNs, including the
  PGN 126720 "Set Zone Name" command that writes this value.

  Evidence: samples/fusion-wb670-zone-indexing.raw.
samples:
- raw: "2023-01-01-00:00:00.000,7,130820,10,255,14,a3,99,2d,80,00,07,43,6f,63,6b,70,69,74,00"  # from fusion-130820.log
  expects:
    manufacturerCode: "Fusion Electronics"
    industryCode: "Marine Industry"
    messageId: "Zone Name"
    zone: 0
    name: "Cockpit"
- raw: "2023-01-01-00:00:00.000,7,130820,10,255,12,a3,99,2d,80,01,05,43,61,62,69,6e,00"  # from fusion-130820.log
  expects:
    manufacturerCode: "Fusion Electronics"
    industryCode: "Marine Industry"
    messageId: "Zone Name"
    zone: 1
    name: "Cabin"
- raw: "2023-01-01-00:00:00.000,7,130820,10,255,13,a3,99,2d,80,02,06,5a,6f,6e,65,20,33,00"  # from fusion-130820.log
  expects:
    manufacturerCode: "Fusion Electronics"
    industryCode: "Marine Industry"
    messageId: "Zone Name"
    zone: 2
    name: "Zone 3"
- raw: "2023-01-01-00:00:00.000,7,130820,51,255,13,a3,99,2d,80,01,06,53,61,6c,c5,8d,6e,00"  # from fusion-130820-utf8.raw
  expects:
    manufacturerCode: "Fusion Electronics"
    industryCode: "Marine Industry"
    messageId: "Zone Name"
    zone: 1
    name: "Salōn"
