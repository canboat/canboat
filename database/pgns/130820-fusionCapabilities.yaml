    zone2: ["bit 0", "Volume Limit", "Balance", "Subwoofer Level", "Subwoofer Low-pass Filter", "bit 5", "Bass", "Midrange", "Treble", "bit 10", "bit 11", "bit 12", "bit 13", "bit 15"]
