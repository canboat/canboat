pgn: 130820
id: fusionCapabilities
description: 'Fusion: Capabilities'
type: Fast
variantOrder: 38
priority: 7
fields:
- id: manufacturerCode
  name: Manufacturer Code
  type: LOOKUP
  bits: 11
  description: Fusion Electronics
  match: 419
  lookup: MANUFACTURER_CODE
- id: reserved
  name: Reserved
  type: RESERVED
  bits: 2
- id: industryCode
  name: Industry Code
  type: LOOKUP
  bits: 3
  description: Marine Industry
  match: 4
  lookup: INDUSTRY_CODE
- id: messageId
  name: Message ID
  type: LOOKUP
  bits: 16
  description: Capabilities
  match: 32798
  lookup: FUSION_STATUS_MESSAGE_ID
  primaryKey: true
- id: zone1
  name: Zone 1
  type: BITLOOKUP
  bits: 16
  lookupBits: FUSION_ZONE_CAPABILITY_BITFIELD
- id: zone2
  name: Zone 2
  type: BITLOOKUP
  bits: 16
  lookupBits: FUSION_ZONE_CAPABILITY_BITFIELD
- id: zone3
  name: Zone 3
  type: BITLOOKUP
  bits: 16
  lookupBits: FUSION_ZONE_CAPABILITY_BITFIELD
- id: zone4
  name: Zone 4
  type: BITLOOKUP
  bits: 16
  lookupBits: FUSION_ZONE_CAPABILITY_BITFIELD
- id: global
  name: Global
  type: BITLOOKUP
  bits: 16
  lookupBits: FUSION_GLOBAL_CAPABILITY_BITFIELD
notes: |-
  The four zone words advertise which controls are supported by each zone;
  they do not contain the current values of those controls. The global word
  is decoded separately: matching bit positions are not assumed to have the
  same meaning unless independently established.

  Confirmed zone capability bits are 1 Volume Limit, 2 Balance, 3 Subwoofer
  Level, 4 Subwoofer Low-pass Filter, 6 Bass, 7 Midrange, 8 Treble and
  9 Variable/Fixed Line Output. Bits 0, 5 and 10-15 remain unknown.

  Confirmed global capability bits are 4 Subwoofer Low-pass Filter and 6-8
  Bass/Midrange/Treble. All other global bits remain unknown.

  A zone capability word of 0x0000 advertises none of the controls represented
  by this bitfield. A non-zero capability word does not by itself establish that
  the corresponding zone exists; zone availability must be determined
  separately.

  The MS-RA70N also provides useful evidence for the global word. Its tone/EQ
  controls (Bass, Midrange and Treble) are stereo-wide rather than per-zone,
  and the corresponding capability bits are advertised in its non-zero global
  word. In contrast, the MS-WB670 reports Global 0x0000. A zero global word
  therefore means only that no capabilities represented by this global bitfield
  are advertised; it must not be interpreted as absence of the stereo or of
  global functionality in general. Conversely, a non-zero global word describes
  advertised global capabilities, not current control values.

  The unknown bits are intentionally left unnamed in the bit lookups. No
  specific meaning for bits 0, 5 or 10-15 has yet been established strongly
  enough to name them. Treat possible associations seen while comparing models
  as hypotheses only until capture evidence establishes their meaning.

  Observed model patterns provide useful targets for that testing. The MS-RA70N
  sample below reports Zone 1 0x000F, Zone 2 0x000F, Zone 3 0x020F,
  Zone 4 0x0000 and Global 0x01D0. The MS-WB670 reports Zone 1 0xFDFF,
  Zone 2 0xBDFF, Zone 3 0xB7FF, Zone 4 0x0000 and Global 0x0000. These
  differences should not by themselves be interpreted as meanings for the
  unknown bits.

  PGN 130820 message id 32865 "Zone Capabilities Extended" repeats these same
  16-bit capability words as the first two bytes of each eight-byte record.
  Evidence for that correspondence is in
  samples/fusion-zone-capabilities-extended.raw.
