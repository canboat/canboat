notes: |-
  One 16-bit capability word per zone slot plus a global word. Each advertises
  which controls exist; none carries a current value. All five words use the
  same bit assignments (FUSION_CAPABILITY_BITFIELD).

  The bit names come from Garmin's own decoder in the Fusion Audio Android app,
  which reads all five words with one class. The app treats a zone as available
  exactly when its word is non-zero, and counts available zones that way.

  The words describe outputs, not the zones in the product literature. On the
  MS-WB670 IntAmp (bit 11) is clear and Line Out (bit 9) set only on index 2,
  its line-level pre-out; only index 0, the internal-amp zone, has Subwoofer On
  Amp (bit 14). The MS-RA70N advertises Bass/Mid/Treble only in its global word,
  matching its stereo-wide tone controls.

  Static: unchanged by the "Internal Amps On" setting. Broadcast on a 5-minute
  cycle and answered on demand via FUSION_MESSAGE_ID 1 "Request Status".

  PGN 130820 message id 32865 "Zone Capabilities Extended" repeats these words
  as the first two bytes of each eight-byte record.

  Evidence: samples/fusion-ra70n-capabilities.raw (MS-RA70N),
  samples/fusion-zone-capabilities-extended.raw (MS-WB670) and
  samples/fusion-130820.log (a 2017 capture of an unidentified Fusion unit).
