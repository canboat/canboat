notes: |-
  The command form of the PGN 130820 "Tone" status (message id 32795): the
  payload is the same shape, and every command carries the full bass/mid/treble
  triple rather than only the axis that moved.

  Zone is zero-based, as elsewhere in the Fusion PGNs.

  Observed on a Fusion MS-WB670 commanded by a B&G Zeus SRX over NMEA 2000.
  The MS-WB670 exposes a single master tone control, so zone was only ever
  observed as 0; the field is nevertheless present on the wire. Range is
  documented as -15 to +15 on the status side.

  Evidence: samples/fusion-set-equalizer.raw.

  NOTE: no `samples:` block. The payload is exactly 8 bytes, which cannot be
  expressed in a single `raw:` line. Keel reads a raw of 8 bytes or fewer as one
  CAN frame -- so it wants the fast-packet header, pushing the line to 10 bytes
  -- and reads anything longer as a coalesced message, so that header is then
  decoded as the manufacturer word and the wrong variant is selected. The same
  limitation leaves 130820 Sublevels and Volume Limits unsampled (see #883).
