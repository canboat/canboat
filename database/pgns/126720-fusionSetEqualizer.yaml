notes: |-
  The command form of the PGN 130820 "Tone" status (message id 32795): the
  payload is the same shape, and every command carries the full bass/mid/treble
  triple rather than only the axis that moved.

  Zone is a zero-based zone index 0 .. n-1, where n is the number of zones
  whose PGN 130820 "Capabilities" word is non-zero. The value n itself
  addresses the stereo as a whole: Garmin's Fusion Audio app sends its global,
  stereo-wide tone control with zone = available zone count. Because n depends
  on the unit, this is not a fixed value. Observed:

    MS-RA70N  2 zones, EQ only in the global capability word  -> zone 2
    MS-BB300R 3 zones                                          -> zone 3
    MS-WB670  3 zones, global capability word 0x0000           -> zone 0

  The MS-RA70N capture contains a sweep of the signed tone values, including
  the endpoints +15 (0x0f) and -15 (0xf1), with each command echoed by a
  matching "Tone" status. This confirms the signed INT8 representation and the
  -15 to +15 range.

  The MS-WB670 was commanded by a B&G Zeus SRX over NMEA 2000, the MS-RA70N
  by an MS-NRX300 remote.

  Evidence: samples/fusion-set-equalizer.raw for the MS-WB670, and
  samples/fusion-ra70n-tone.raw for the MS-RA70N.
