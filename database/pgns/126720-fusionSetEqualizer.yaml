notes: |-
  The command form of the PGN 130820 "Tone" status (message id 32795): the
  payload is the same shape, and every command carries the full bass/mid/treble
  triple rather than only the axis that moved.

  Zone is zero-based, as elsewhere in the Fusion PGNs.

  Observed on both a Fusion MS-WB670 and an MS-RA70N. The MS-WB670 capture
  was commanded by a B&G Zeus SRX over NMEA 2000; the MS-RA70N capture was
  made while changing Tone from an NRX300 remote. Both stereos expose a single
  master tone control, and both use zone 0 for Set Equalizer; the zone field is
  nevertheless present on the wire and should not be interpreted as proof of
  per-zone EQ support.

  The MS-RA70N capture contains a sweep of the signed tone values. Set Equalizer
  commands are followed by PGN 130820 message id 32795 "Tone" status carrying
  the same values, including the documented endpoints +15 (0x0f) and -15
  (0xf1). This confirms both the signed INT8 representation and the -15 to +15
  range on the command/status pair.

  Evidence: samples/fusion-set-equalizer.raw for the MS-WB670, and
  samples/fusion-ra70n-tone.raw for the MS-RA70N.
