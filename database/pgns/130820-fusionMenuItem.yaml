pgn: 130820
id: fusionMenuItem
description: 'Fusion: Menu Item'
type: Fast
variantOrder: 26
priority: 7
fields:
- id: manufacturerCode
  name: Manufacturer Code
  type: LOOKUP
  bits: 11
  description: Fusion Electronics
  match: 419
  lookup: MANUFACTURER_CODE
- id: reserved
  name: Reserved
  type: RESERVED
  bits: 2
- id: industryCode
  name: Industry Code
  type: LOOKUP
  bits: 3
  description: Marine Industry
  match: 4
  lookup: INDUSTRY_CODE
- id: messageId
  name: Message ID
  type: LOOKUP
  bits: 16
  description: Menu Item
  match: 32785
  lookup: FUSION_STATUS_MESSAGE_ID
  primaryKey: true
- id: sourceId
  name: Source ID
  type: UINT8
  primaryKey: true
- id: itemIndex
  name: Item Index
  type: UINT32
- id: flags
  name: Flags
  type: BITLOOKUP
  bits: 8
  lookupBits: FUSION_MENU_ITEM_FLAGS
- id: lockId
  name: Lock ID
  type: UINT8
- id: text
  name: Text
  type: STRING_LZ
notes: |-
  Menu Item flag bit 1 (0x02) is observed as Selected. In Bluetooth menu
  captures it is set for the selected device and while Discoverable is enabled;
  the meaning of the remaining flag bits is not yet established.

  lockId is the one-byte menu lock ID allocated by PGN 130820 message id 32786
  "Menu Lock ID". It is then carried by Menu Action, Menu Count and Menu Item
  operations.

  It is distinct from the four-byte requestToken used to correlate the PGN
  126720 proprietary id 12 request with the allocation response. Capture
  evidence shows the returned lockId being reused by subsequent menu operations.

  Evidence: samples/fusion-ra70n-menu-operations.raw,
  samples/fusion-ms-ra70n-bluetooth-menu.raw and the existing
  samples/boatkit-fusion-menu.raw.
