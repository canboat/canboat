pgn: 65226
id: activeTroubleCodes
description: Active Trouble Codes
type: Single
missing:
- Fields
- FieldLengths
- Resolution
fields:
- id: protectLampStatus
  name: Protect Lamp Status
  type: LOOKUP
  bits: 2
  lookup: J1939_LAMP_STATUS
- id: amberWarningLampStatus
  name: Amber Warning Lamp Status
  type: LOOKUP
  bits: 2
  lookup: J1939_LAMP_STATUS
- id: redStopLampStatus
  name: Red Stop Lamp Status
  type: LOOKUP
  bits: 2
  lookup: J1939_LAMP_STATUS
- id: malfunctionIndicatorLampStatus
  name: Malfunction Indicator Lamp Status
  type: LOOKUP
  bits: 2
  lookup: J1939_LAMP_STATUS
- id: flashProtectLamp
  name: Flash Protect Lamp
  type: NUMBER
  bits: 2
- id: flashAmberWarningLamp
  name: Flash Amber Warning Lamp
  type: NUMBER
  bits: 2
- id: flashRedStopLamp
  name: Flash Red Stop Lamp
  type: NUMBER
  bits: 2
- id: flashMalfunctionIndicatorLamp
  name: Flash Malfunction Indicator Lamp
  type: NUMBER
  bits: 2
- repeat:
    fields:
    - id: spn
      name: SPN
      description: Suspect Parameter Number of the fault
      type: LOOKUP
      bits: 16
      lookup: J1939_SPN
      specialValues: 0
      note: J1939-73 splits the 19-bit SPN around the FMI. These are its bits 1-16; spnHigh holds bits 17-19.
    - id: fmi
      name: FMI
      description: Failure Mode Identifier
      type: NUMBER
      bits: 5
      specialValues: 0
    - id: spnHigh
      name: SPN (high 3 bits)
      description: The SPN's bits 17-19
      type: NUMBER
      bits: 3
      continues: spn
      specialValues: 0
    - id: oc
      name: OC
      description: Occurrence Count; 127 is not available
      type: NUMBER
      bits: 7
      specialValues: 1
    - id: cm
      name: CM
      description: SPN Conversion Method. 0 is the current SPN layout, the one decoded here; 1 marks an older J1939-73 layout, so the SPN shown for such a code is wrong
      type: NUMBER
      bits: 1
      specialValues: 0
samples:
- raw: "2023-01-01-00:00:00.000,6,65226,0,255,8,40,ff,64,00,01,03,ff,ff"  # J1939-73 layout, by hand
  expects:
    malfunctionIndicatorLampStatus: "On"
    spn.1: Engine Oil Pressure
    fmi.1: 1
    oc.1: 3
- raw: "2023-01-01-00:00:00.000,6,65226,0,255,8,00,ff,00,f0,e2,05,ff,ff"  # SPN 61440 + 7 * 65536, by hand
  expects:
    spn.1: 520192
    fmi.1: 2
    oc.1: 5
notes: |-
  J1939 PGN 65226 See https://embeddedflakes.com/j1939-diagnostics-part-1/

  DTC layout per SAE J1939-73, as NMFTA's pretty_j1939 decodes it: bytes 1-2 SPN bits 1-16, byte 3 bits 1-5 FMI and bits 6-8 SPN bits 17-19, byte 4 bits 1-7 OC and bit 8 CM.

  CM (SPN Conversion Method): the early J1939-73 versions described where the
  19-bit SPN sits in these four bytes ambiguously, and ECU makers shipped
  different readings of it -- most significant byte first instead of J1939's
  usual least significant first, and the three high bits in a different order.
  The standard then fixed the layout above and turned the old ones into
  conversion methods 1-3. CM = 0 says a code uses the current layout; CM = 1
  says it uses one of the old ones, without saying which, so tools pick one per
  engine make. Only CM = 0 is decoded correctly here: a CM = 1 code shows a
  wrong SPN (and SPN name). Supporting the old layouts needs a capture from such
  an ECU, and a variant matched on CM.

  Lamp modes are: 0 = off, 01 = on
