- Resolution
explanation: Manufacturer proprietary PGNs in PDU1 (addressed) single-frame PGN 0xEF00 (61184). When this is shown during analysis it means the PGN is not reverse engineered yet.
notes: Unlike NMEA 2000, J1939 does not put a Manufacturer Code and Industry Code at the start of a proprietary payload; SAE J1939-21 leaves all of it to the manufacturer. Who sent the frame is known only from its source address and the NAME that address claimed (PGN 60928).
